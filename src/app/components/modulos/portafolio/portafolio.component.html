<section class="bg-black text-white py-20 px-6" appScrollReveal>
  <div class="text-center mb-12 max-w-2xl mx-auto">
    <h2 class="text-4xl font-bold text-golden mb-4">Portafolio</h2>
    <p class="text-lg text-gray-300">
      Algunos proyectos reales que hemos desarrollado para nuestros clientes.
    </p>
  </div>

  <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
    @for (proyecto of proyectos; track proyecto.nombre) {
      <div class="bg-gray-900 border border-golden rounded-lg p-6 flex flex-col" appScrollReveal>
        <span class="text-xs border border-golden rounded-full px-3 py-1 text-golden self-start mb-4">
          {{ proyecto.etiqueta }}
        </span>
        <h3 class="text-xl font-bold mb-2">{{ proyecto.nombre }}</h3>
        <p class="text-gray-300 text-sm mb-6 flex-grow">{{ proyecto.descripcion }}</p>
        <a [href]="proyecto.url" target="_blank" rel="noopener" class="btn-golden-sm self-start">
          Ver proyecto
        </a>
      </div>
    }
  </div>

  <div class="text-center max-w-xl mx-auto mt-16">
    <p class="text-gray-300 mb-4">¿Querés ser el próximo caso de éxito?</p>
    <button routerLink="/contacto" class="btn-golden-sm">
      Cuéntanos tu idea
    </button>
  </div>
</section>
